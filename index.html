<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Dash Board Last Mile</title>
<link rel="icon" href="https://i.ibb.co/KjmjjvNZ/Captura-de-pantalla-2025-09-15-161315.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --amarillo:#F5C400; --amarillo-claro:#FFE066;
    --fondo:#0A0A0A; --panel:#141414; --borde:#262626;
    --texto:#F5F1E6; --tenue:#9a9a9a;
    --ok:#6fd66f; --pendiente:#F5C400;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Manrope',sans-serif; color:var(--texto);
    min-height:100vh;
    background:radial-gradient(circle at 15% 0%, #262004 0%, #0A0A0A 42%),
               linear-gradient(180deg,#0A0A0A 0%, #050505 100%);
    background-attachment:fixed;
  }
  ::selection{background:var(--amarillo); color:#0A0A0A}
  a{color:var(--amarillo)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#111}
  ::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:10px}

  /* ── Encabezado fijo y compacto: marca + cifras + buscador + filtros ── */
  header{
    position:sticky; top:0; z-index:20;
    padding:10px 24px 12px;
    background:rgba(10,10,10,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(245,196,0,.18);
    display:flex; flex-direction:column; gap:10px;
  }
  .fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:11px;margin-right:auto}
  .marca img{height:40px;width:auto;max-width:120px;object-fit:contain}
  .marca h1{
    margin:0;font-size:16px;font-weight:800;letter-spacing:.2px;line-height:1.15;
    background:linear-gradient(90deg,var(--amarillo-claro),var(--amarillo));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .marca p{margin:2px 0 0;font-size:11.5px;color:var(--tenue)}

  .cifras{display:flex;gap:8px;flex-wrap:wrap}
  .cifra{
    display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--borde);white-space:nowrap;
  }
  .cifra b{font-size:15px;font-weight:800;color:#fff;line-height:1}
  .cifra span{font-size:11.5px;color:var(--tenue);font-weight:600}
  .cifra.alerta b{color:var(--amarillo)}
  .cifra.alerta{border-color:rgba(245,196,0,.45)}

  .btn-refrescar{
    display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;cursor:pointer;
    background:var(--panel);border:1px solid #2c2c2c;color:#c9c9c9;font:inherit;font-size:12.5px;font-weight:600;
  }
  .btn-refrescar:hover{border-color:var(--amarillo);color:#fff}
  .btn-refrescar.cargando svg{animation:girar .9s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}

  .buscador{position:relative;width:290px;flex:0 1 290px}
  .buscador svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--amarillo)}
  .buscador input{
    width:100%;padding:9px 12px 9px 37px;border-radius:10px;border:1px solid #2c2c2c;
    background:var(--panel);color:#fff;font:inherit;font-size:13.5px;
  }
  .buscador input::placeholder{color:#8A8A8A}
  .buscador input:focus{outline:none;box-shadow:0 0 0 2px var(--amarillo)}

  .grupo-btn{display:flex;background:var(--panel);border:1px solid #2c2c2c;border-radius:10px;padding:3px;gap:3px}
  .grupo-btn button{
    padding:6px 13px;border:none;border-radius:8px;font:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;background:transparent;color:#a3a3a3;white-space:nowrap;
  }
  .grupo-btn button.on{background:linear-gradient(90deg,var(--amarillo-claro),var(--amarillo));color:#0A0A0A}

  .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{
    cursor:pointer;user-select:none;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;
    background:var(--panel);color:#c9c9c9;border:1px solid #2c2c2c;white-space:nowrap;
  }
  .chip.on{background:linear-gradient(90deg,var(--amarillo-claro),var(--amarillo));color:#0A0A0A;font-weight:700;border-color:transparent}
  .separador{width:1px;height:20px;background:#2c2c2c;margin:0 3px}

  main{padding:22px 24px 48px;max-width:1440px;margin:0 auto}

  section.bloque{margin-bottom:34px}
  .enc-jefe{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .avatar{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--amarillo),#5c4700);font-weight:800;color:#0A0A0A;font-size:14px;
  }
  .enc-jefe .n{font-weight:700;font-size:16px;color:#fff}
  .enc-jefe .c{font-size:12.5px;color:#8a8a8a}

  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .tarjeta{
    display:flex;flex-direction:column;border-radius:20px;background:var(--panel);
    border:1px solid var(--borde);overflow:hidden;position:relative;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .tarjeta:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(245,196,0,.14);border-color:var(--amarillo)}
  .cabecera{position:relative;height:108px;display:flex;align-items:center;justify-content:center}
  .cabecera::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 60%)}
  .cabecera img.logo{max-height:62px;max-width:70%;object-fit:contain;position:relative;z-index:1}
  .icono{
    width:52px;height:52px;border-radius:50%;background:rgba(10,10,10,.35);
    display:flex;align-items:center;justify-content:center;position:relative;z-index:1;
  }
  .estado{
    position:absolute;top:12px;right:12px;z-index:2;font-size:11px;font-weight:700;padding:4px 10px;
    border-radius:999px;background:rgba(10,10,10,.6);
  }
  .estado.ok{color:var(--ok);border:1px solid var(--ok)}
  .estado.pend{color:var(--pendiente);border:1px solid var(--pendiente)}
  .fav{
    position:absolute;top:12px;left:12px;z-index:3;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(10,10,10,.6);border:1px solid #3a3a3a;color:#7a7a7a;
  }
  .fav.on{color:var(--amarillo);border-color:var(--amarillo)}
  .candado{
    position:absolute;top:12px;left:46px;z-index:3;height:28px;padding:0 10px;border-radius:999px;
    display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.3px;
    background:rgba(10,10,10,.7);border:1px solid var(--amarillo);color:var(--amarillo);
  }
  .tarjeta.privada .cabecera img.logo,
  .tarjeta.privada .cabecera .icono{filter:blur(3px) grayscale(.4);opacity:.75}
  .cuerpo{padding:15px 17px 17px;display:flex;flex-direction:column;gap:7px;flex:1}
  .etiqueta{
    align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    color:var(--amarillo);background:rgba(245,196,0,.1);padding:3px 10px;border-radius:999px;
  }
  .tarjeta h3{margin:0;font-size:15.5px;font-weight:700;color:#fff;line-height:1.3}
  .meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tenue)}
  .acciones{margin-top:auto;display:flex;gap:7px;padding-top:10px}
  .abrir{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    font-size:13px;font-weight:700;color:#0A0A0A;background:linear-gradient(90deg,var(--amarillo-claro),var(--amarillo));
    padding:9px 0;border-radius:999px;
  }
  .abrir.off{background:#1e1e1e;color:#6a6a6a;border:1px dashed #3a3a3a}
  button.abrir{font:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer}
  button.abrir.bloqueada{background:#241f05;color:var(--amarillo);border:1px solid var(--amarillo)}
  .accion{
    width:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;border-radius:999px;
    cursor:pointer;background:#1c1c1c;border:1px solid #333;color:#c9c9c9;
  }
  .accion:hover{border-color:var(--amarillo);color:var(--amarillo)}
  .accion.copiado{border-color:var(--ok);color:var(--ok)}

  .aviso{color:#8a8a8a;padding:26px 0;font-size:15px}
  .aviso b{color:#fff}
  .esqueleto{height:250px;border-radius:20px;background:linear-gradient(90deg,#141414,#1c1c1c,#141414);
    background-size:200% 100%;animation:brillo 1.2s ease infinite}
  @keyframes brillo{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .modal{
    position:fixed;inset:0;z-index:50;background:rgba(5,5,5,.85);backdrop-filter:blur(4px);
    display:none;flex-direction:column;padding:22px;
  }
  .modal.on{display:flex}
  .modal-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .modal-cab h4{margin:0;font-size:16px;color:#fff}
  .modal-cab .der{display:flex;gap:10px}
  .modal-cab a,.modal-cab button{
    font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;
    text-decoration:none;background:#1c1c1c;border:1px solid #333;color:#e5e5e5;
  }
  .modal-cab a:hover,.modal-cab button:hover{border-color:var(--amarillo)}
  .modal iframe{flex:1;width:100%;border:1px solid #2c2c2c;border-radius:14px;background:#fff}

  /* Diálogo del PIN de gerencia */
  .pin-fondo{
    position:fixed;inset:0;z-index:70;background:rgba(5,5,5,.88);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .pin-fondo.on{display:flex}
  .pin-caja{
    width:340px;max-width:100%;background:var(--panel);border:1px solid #2c2c2c;border-radius:20px;
    padding:26px 24px;text-align:center;
  }
  .pin-caja .llave{
    width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(245,196,0,.12);border:1px solid rgba(245,196,0,.45);color:var(--amarillo);
  }
  .pin-caja h4{margin:0 0 6px;font-size:17px;color:#fff}
  .pin-caja p{margin:0 0 18px;font-size:13px;color:var(--tenue);line-height:1.45}
  .pin-caja p b{color:#e5e5e5}
  .pin-caja input{
    width:100%;text-align:center;letter-spacing:8px;font:inherit;font-size:22px;font-weight:700;
    padding:12px;border-radius:12px;border:1px solid #2c2c2c;background:#0f0f0f;color:#fff;
  }
  .pin-caja input:focus{outline:none;box-shadow:0 0 0 2px var(--amarillo)}
  .pin-caja.error input{border-color:#e05555;animation:sacudir .3s}
  @keyframes sacudir{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pin-error{min-height:18px;margin:9px 0 0;font-size:12.5px;color:#e05555;font-weight:600}
  .pin-btns{display:flex;gap:9px;margin-top:14px}
  .pin-btns button{
    flex:1;font:inherit;font-size:13.5px;font-weight:700;padding:11px 0;border-radius:12px;cursor:pointer;
    border:1px solid #333;background:#1c1c1c;color:#d5d5d5;
  }
  .pin-btns button.principal{
    background:linear-gradient(90deg,var(--amarillo-claro),var(--amarillo));color:#0A0A0A;border:none;
  }
  .sesion{
    display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:rgba(111,214,111,.1);border:1px solid var(--ok);color:var(--ok);
    font-size:11.5px;font-weight:700;white-space:nowrap;
  }
  .sesion.on{display:flex}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:60;
    background:#1c1c1c;border:1px solid var(--ok);color:#fff;font-size:13.5px;font-weight:600;
    padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:760px){
    header{padding:10px 16px 12px}
    main{padding:18px 16px 40px}
    .marca h1{font-size:14px} .marca p{display:none}
    .buscador{flex:1 1 100%;width:auto}
    .cifras{order:3;width:100%}
  }
</style>
</head>
<body>

<header>
  <div class="fila">
    <div class="marca">
      <img src="https://i.ibb.co/KjmjjvNZ/Captura-de-pantalla-2025-09-15-161315.jpg" alt="Last Mile">
      <div>
        <h1 id="nombreArchivo">CENTRO DE DASH BOARD LAST MILE</h1>
        <p>Todos los dashboards de proyectos en un solo lugar</p>
      </div>
    </div>
    <div class="cifras" id="cifras"></div>
    <span class="sesion" id="sesion" title="Cerrar el acceso de gerencia">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      Acceso gerencia · Cerrar
    </span>
    <button class="btn-refrescar" id="btnRefrescar" title="Volver a leer los datos">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
      Actualizar
    </button>
  </div>

  <div class="fila">
    <div class="buscador">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="busqueda" type="text" placeholder="Buscar proyecto, jefe, líder o CECO…" autocomplete="off">
    </div>
    <div class="grupo-btn" id="agrupar">
      <button data-modo="jefe" class="on">Por jefe</button>
      <button data-modo="proyecto">Por proyecto</button>
      <button data-modo="favoritos">★ Favoritos</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main><div id="contenido"></div></main>

<div class="modal" id="modal">
  <div class="modal-cab">
    <h4 id="modalTitulo"></h4>
    <div class="der">
      <a id="modalAbrir" href="#" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
      <button id="modalCerrar">Cerrar ✕</button>
    </div>
  </div>
  <iframe id="modalFrame" src="about:blank" referrerpolicy="no-referrer"></iframe>
</div>

<div class="pin-fondo" id="pinFondo">
  <div class="pin-caja" id="pinCaja">
    <div class="llave">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h4>Informe restringido</h4>
    <p><b id="pinProyecto"></b><br>Ingresa el PIN de gerencia para continuar.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
    <p class="pin-error" id="pinError"></p>
    <div class="pin-btns">
      <button id="pinCancelar">Cancelar</button>
      <button id="pinAceptar" class="principal">Desbloquear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   CONFIGURACIÓN — lo único que se toca para apuntar a otro Sheet
   ───────────────────────────────────────────────────────────── */
const SHEET_ID  = '1QRFSnvtoog_Ei8LZel256vKPAqvn9Y_NVyB-U6gIuGc';
const SHEET_GID = '0';
const URL_DATOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;

/* PIN de gerencia — se guarda el hash SHA-256, nunca el PIN en texto plano.
   Para cambiarlo: abre la consola del navegador (F12) en esta página, ejecuta
   await hashPin('elNuevoPin') y pega aquí el resultado. PIN actual: 4821 */
const PIN_HASH = 'a388f562e286fdf28986f9253579f4d096446e01dd0c771996a51ff11b390fa2';
/* Valores de la columna ACCESO del Sheet que marcan un informe como privado */
const MARCAS_PRIVADO = ['PRIVADO','PRIVADA','RESTRINGIDO','GERENCIAL','SI','X','BLOQUEADO'];

const ICONOS = {
  camion:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>',
  grafica:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>'
};
const DEGRADADOS = [
  'linear-gradient(135deg,#3a3204,#1a1704)',
  'linear-gradient(135deg,#3d2b04,#1c1504)',
  'linear-gradient(135deg,#332f04,#171504)',
  'linear-gradient(135deg,#403804,#1e1904)'
];

/* ── Estado ── */
let PROYECTOS = [];
const estado = { q:'', modo:'jefe', jefe:'todos', tipo:'todos' };
const FAVS = new Set(JSON.parse(localStorage.getItem('cd_favs') || '[]'));

/* El desbloqueo dura solo la sesión del navegador: al cerrar la pestaña
   vuelve a pedir el PIN. Nunca se guarda el PIN, solo la marca de acceso. */
let desbloqueado = sessionStorage.getItem('cd_acceso') === '1';

/* ── Utilidades ── */
const norm = s => (s||'').toString().trim();
const capitalizar = s => norm(s).toLowerCase().replace(/\b[\wáéíóúñ]/g, c => c.toUpperCase());
const iniciales = s => norm(s).split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const escapar = s => norm(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Extrae el src de la celda LOGO (puede venir como <a><img src="…"></a>) */
function sacarLogo(celda){
  const t = norm(celda);
  if(!t) return '';
  const m = t.match(/src\s*=\s*["']([^"']+)["']/i);
  if(m) return m[1];
  return /^https?:\/\//i.test(t) ? t : '';
}

/* Convierte un enlace de Drive a su versión embebible */
function urlEmbebida(url){
  const m = norm(url).match(/drive\.google\.com\/file\/d\/([^/]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : url;
}

function avisar(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ── PIN de gerencia ─────────────────────────────────────────────
   Aviso honesto: el Sheet de origen es público, así que esto restringe
   quién ve y comparte los enlaces desde la página, no impide que alguien
   con conocimientos técnicos llegue al dato por otra vía. */
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

let accionPendiente = null;   // qué hacer apenas se valide el PIN

function pedirPin(proyecto, accion){
  accionPendiente = accion;
  document.getElementById('pinProyecto').textContent = capitalizar(proyecto);
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinCaja').classList.remove('error');
  const inp = document.getElementById('pinInput');
  inp.value = '';
  document.getElementById('pinFondo').classList.add('on');
  setTimeout(() => inp.focus(), 60);
}

function cerrarPin(){
  document.getElementById('pinFondo').classList.remove('on');
  accionPendiente = null;
}

async function validarPin(){
  const inp = document.getElementById('pinInput');
  const caja = document.getElementById('pinCaja');
  if(!inp.value.trim()) return;

  if(await hashPin(inp.value.trim()) !== PIN_HASH){
    caja.classList.add('error');
    document.getElementById('pinError').textContent = 'PIN incorrecto. Intenta de nuevo.';
    inp.value = ''; inp.focus();
    setTimeout(() => caja.classList.remove('error'), 400);
    return;
  }

  desbloqueado = true;
  sessionStorage.setItem('cd_acceso', '1');
  const accion = accionPendiente;
  cerrarPin();
  pintarSesion();
  pintar();
  avisar('Acceso concedido a los informes restringidos');
  if(accion) accion();
}

function cerrarSesionGerencia(){
  desbloqueado = false;
  sessionStorage.removeItem('cd_acceso');
  pintarSesion();
  pintar();
  avisar('Acceso de gerencia cerrado');
}

function pintarSesion(){
  document.getElementById('sesion').classList.toggle('on', desbloqueado);
}

/* Copia al portapapeles con respaldo para navegadores sin permiso directo */
async function copiar(texto){
  try{
    await navigator.clipboard.writeText(texto);
  }catch(_){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

/* ── Lectura del Sheet ── */
async function cargar(){
  const btn = document.getElementById('btnRefrescar');
  btn.classList.add('cargando');
  if(!PROYECTOS.length){
    document.getElementById('contenido').innerHTML =
      '<div class="rejilla">' + '<div class="esqueleto"></div>'.repeat(6) + '</div>';
  }

  try{
    const r = await fetch(`${URL_DATOS}&_=${Date.now()}`);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const txt  = await r.text();
    const json = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));

    const cols = json.table.cols.map(c => norm(c.label).toUpperCase());
    const idx  = etiqueta => cols.findIndex(c => c.startsWith(etiqueta));
    const iTipo = idx('TIPO'), iJefe = idx('JEFE'), iLider = idx('LIDER'),
          iCeco = idx('CECO'), iProy = idx('PROYECTO'), iLogo = idx('LOGO'),
          iInf = idx('INFORME'), iAcc = idx('ACCESO');

    const celda = (fila,i) => (i < 0 || !fila.c || !fila.c[i]) ? '' : norm(fila.c[i].f ?? fila.c[i].v);

    PROYECTOS = json.table.rows
      .map((fila,n) => ({
        id:       'p' + n,
        tipo:     celda(fila,iTipo).toUpperCase() || 'PROYECTOS',
        jefe:     celda(fila,iJefe) || 'SIN ASIGNAR',
        lider:    celda(fila,iLider),
        ceco:     celda(fila,iCeco),
        proyecto: celda(fila,iProy),
        logo:     sacarLogo(celda(fila,iLogo)),
        informe:  celda(fila,iInf),
        privado:  MARCAS_PRIVADO.includes(celda(fila,iAcc).toUpperCase()),
        deg:      DEGRADADOS[n % DEGRADADOS.length]
      }))
      .filter(p => p.proyecto);

    localStorage.setItem('cd_cache', JSON.stringify(PROYECTOS));
    btn.title = 'Actualizado ' + new Date().toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'});
    pintarChips(); pintar();
  }catch(e){
    if(leerCache()){
      btn.title = 'Sin conexión con el origen de datos — mostrando la última copia guardada';
      pintarChips(); pintar();
      avisar('Sin conexión: mostrando la última copia guardada');
    }else{
      document.getElementById('contenido').innerHTML =
        `<p class="aviso"><b>No se pudieron cargar los proyectos.</b><br>
         Revisa la conexión e intenta con el botón <b>Actualizar</b>.
         <br><small style="color:#5a5a5a">Detalle: ${escapar(e.message)}</small></p>`;
      document.getElementById('cifras').innerHTML = '';
    }
  }finally{
    btn.classList.remove('cargando');
  }
}

function leerCache(){
  try{ const c = JSON.parse(localStorage.getItem('cd_cache')||'[]');
       if(c.length){ PROYECTOS = c; return true; } }catch(_){}
  return false;
}

/* ── Filtro ── */
const clave = p => `${p.ceco}|${p.proyecto}`;
function filtrar(){
  const q = estado.q.trim().toLowerCase();
  return PROYECTOS.filter(p => {
    if(estado.modo === 'favoritos' && !FAVS.has(clave(p))) return false;
    if(estado.jefe !== 'todos' && p.jefe !== estado.jefe)  return false;
    if(estado.tipo !== 'todos' && p.tipo !== estado.tipo)  return false;
    if(!q) return true;
    return [p.proyecto,p.jefe,p.lider,p.ceco,p.tipo].join(' ').toLowerCase().includes(q);
  });
}

/* ── Render ── */
function pintarCifras(visibles){
  const con   = PROYECTOS.filter(p => p.informe).length;
  const pend  = PROYECTOS.length - con;
  const jefes = new Set(PROYECTOS.map(p => p.jefe)).size;
  document.getElementById('cifras').innerHTML = `
    <div class="cifra"><b>${visibles}</b><span>de ${PROYECTOS.length} proyectos</span></div>
    <div class="cifra"><b>${con}</b><span>con dashboard</span></div>
    <div class="cifra ${pend ? 'alerta' : ''}"><b>${pend}</b><span>pendientes</span></div>
    <div class="cifra"><b>${jefes}</b><span>jefes</span></div>`;
}

function pintarChips(){
  const jefes = [...new Set(PROYECTOS.map(p => p.jefe))].sort();
  const tipos = [...new Set(PROYECTOS.map(p => p.tipo))].sort();
  const cont = document.getElementById('chips');
  cont.innerHTML =
    ['todos',...jefes].map(j =>
      `<span class="chip ${estado.jefe===j?'on':''}" data-jefe="${escapar(j)}">${j==='todos'?'Todos los jefes':escapar(capitalizar(j))}</span>`).join('') +
    (tipos.length > 1
      ? `<span class="separador"></span>` +
        ['todos',...tipos].map(t =>
          `<span class="chip ${estado.tipo===t?'on':''}" data-tipo="${escapar(t)}">${t==='todos'?'Todo tipo':escapar(capitalizar(t))}</span>`).join('')
      : '');

  cont.querySelectorAll('[data-jefe]').forEach(el =>
    el.onclick = () => { estado.jefe = el.dataset.jefe; pintarChips(); pintar(); });
  cont.querySelectorAll('[data-tipo]').forEach(el =>
    el.onclick = () => { estado.tipo = el.dataset.tipo; pintarChips(); pintar(); });
}

const SVG_COPIAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
const SVG_LISTO  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';

const SVG_CANDADO = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

function tarjeta(p){
  const tiene = !!p.informe;
  const fav   = FAVS.has(clave(p));
  // Bloqueada = marcada como privada en el Sheet y sin PIN validado en esta sesión
  const bloq  = p.privado && !desbloqueado;
  const visual = p.logo
    ? `<img class="logo" src="${escapar(p.logo)}" alt="" loading="lazy" data-tipo="${escapar(p.tipo)}">`
    : `<div class="icono">${p.tipo === 'GERENCIAL' ? ICONOS.grafica : ICONOS.camion}</div>`;

  return `
  <article class="tarjeta ${bloq?'privada':''}" data-id="${p.id}">
    <div class="cabecera" style="background:${p.deg}">
      <span class="fav ${fav?'on':''}" data-fav="${p.id}" title="Marcar como favorito">${fav?'★':'☆'}</span>
      ${p.privado ? `<span class="candado" title="${bloq?'Requiere PIN de gerencia':'Restringido · desbloqueado en esta sesión'}">${SVG_CANDADO}${bloq?'PRIVADO':'ABIERTO'}</span>` : ''}
      <span class="estado ${tiene?'ok':'pend'}">${tiene ? 'Con dashboard' : 'Pendiente'}</span>
      ${visual}
    </div>
    <div class="cuerpo">
      <span class="etiqueta">${escapar(capitalizar(p.tipo))}${p.ceco ? ' · CECO ' + escapar(p.ceco) : ''}</span>
      <h3>${escapar(capitalizar(p.proyecto))}</h3>
      <div class="meta">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
        <span>Jefe: ${escapar(capitalizar(p.jefe))}</span>
      </div>
      ${p.lider ? `<div class="meta">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-3-3.87"></path><path d="M4 21v-2a4 4 0 0 1 3-3.87"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Líder: ${escapar(capitalizar(p.lider))}</span></div>` : ''}
      <div class="acciones">
        ${!tiene
          ? `<span class="abrir off">Sin informe cargado</span>`
          : (bloq
            // Bloqueada: botón sin href — la URL no queda en el HTML hasta desbloquear
            ? `<button class="abrir bloqueada" data-abrir="${p.id}">${SVG_CANDADO} Requiere PIN</button>`
            : `<a class="abrir" href="${escapar(p.informe)}" target="_blank" rel="noopener">Abrir dashboard
                 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>`)
          }
        ${tiene ? `
             <span class="accion" data-copiar="${p.id}" title="${bloq?'Copiar enlace · requiere PIN':'Copiar enlace para compartir'}">${bloq ? SVG_CANDADO : SVG_COPIAR}</span>
             <span class="accion" data-previa="${p.id}" title="${bloq?'Vista rápida · requiere PIN':'Vista rápida sin salir de la página'}">
               <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>` : ''}
      </div>
    </div>
  </article>`;
}

function pintar(){
  const lista = filtrar();
  const cont  = document.getElementById('contenido');
  pintarCifras(lista.length);

  if(!lista.length){
    cont.innerHTML = `<p class="aviso">${
      estado.modo === 'favoritos'
        ? 'Aún no has marcado favoritos. Usa la ★ en cualquier tarjeta.'
        : 'No se encontraron proyectos con esos filtros.'}</p>`;
    return;
  }

  if(estado.modo === 'jefe'){
    const mapa = new Map();
    lista.forEach(p => { if(!mapa.has(p.jefe)) mapa.set(p.jefe, []); mapa.get(p.jefe).push(p); });
    // Gerencial primero, luego jefes alfabéticamente
    const orden = [...mapa.keys()].sort((a,b) => {
      const ga = mapa.get(a)[0].tipo === 'GERENCIAL', gb = mapa.get(b)[0].tipo === 'GERENCIAL';
      return ga !== gb ? (ga ? -1 : 1) : a.localeCompare(b);
    });
    cont.innerHTML = orden.map(j => {
      const items = mapa.get(j);
      return `<section class="bloque">
        <div class="enc-jefe">
          <div class="avatar">${iniciales(j)}</div>
          <div>
            <div class="n">${escapar(capitalizar(j))}</div>
            <div class="c">${items.length} proyecto${items.length !== 1 ? 's' : ''} ·
              ${items.filter(p=>p.informe).length} con dashboard</div>
          </div>
        </div>
        <div class="rejilla">${items.map(tarjeta).join('')}</div>
      </section>`;
    }).join('');
  }else{
    const ord = [...lista].sort((a,b) => a.proyecto.localeCompare(b.proyecto));
    cont.innerHTML = `<div class="rejilla">${ord.map(tarjeta).join('')}</div>`;
  }

  // Si un logo del Sheet no carga (enlace roto o caído), se reemplaza por el icono
  cont.querySelectorAll('img.logo').forEach(img => {
    const respaldo = () => {
      const d = document.createElement('div');
      d.className = 'icono';
      d.innerHTML = img.dataset.tipo === 'GERENCIAL' ? ICONOS.grafica : ICONOS.camion;
      img.replaceWith(d);
    };
    img.onerror = respaldo;
    if(img.complete && img.naturalWidth === 0) respaldo();
  });

  cont.querySelectorAll('[data-fav]').forEach(el => el.onclick = e => {
    e.preventDefault();
    const p = PROYECTOS.find(x => x.id === el.dataset.fav);
    const k = clave(p);
    FAVS.has(k) ? FAVS.delete(k) : FAVS.add(k);
    localStorage.setItem('cd_favs', JSON.stringify([...FAVS]));
    pintar();
  });

  // Abrir un informe restringido: pide el PIN y luego lo abre
  cont.querySelectorAll('[data-abrir]').forEach(el => el.onclick = () => {
    const p = PROYECTOS.find(x => x.id === el.dataset.abrir);
    pedirPin(p.proyecto, () => {
      if(!window.open(p.informe, '_blank', 'noopener')){
        avisar('Desbloqueado. Vuelve a pulsar “Abrir dashboard”.');
      }
    });
  });

  cont.querySelectorAll('[data-copiar]').forEach(el => el.onclick = () => {
    const p = PROYECTOS.find(x => x.id === el.dataset.copiar);
    const hacer = async () => {
      await copiar(p.informe);
      const btn = document.querySelector(`[data-copiar="${p.id}"]`);
      if(btn){
        btn.innerHTML = SVG_LISTO;
        btn.classList.add('copiado');
        setTimeout(() => { btn.innerHTML = SVG_COPIAR; btn.classList.remove('copiado'); }, 1600);
      }
      avisar('Enlace copiado: ' + capitalizar(p.proyecto));
    };
    (p.privado && !desbloqueado) ? pedirPin(p.proyecto, hacer) : hacer();
  });

  cont.querySelectorAll('[data-previa]').forEach(el => el.onclick = () => {
    const p = PROYECTOS.find(x => x.id === el.dataset.previa);
    (p.privado && !desbloqueado) ? pedirPin(p.proyecto, () => abrirModal(p)) : abrirModal(p);
  });
}

/* ── Vista rápida ── */
function abrirModal(p){
  document.getElementById('modalTitulo').textContent = capitalizar(p.proyecto);
  document.getElementById('modalAbrir').href = p.informe;
  document.getElementById('modalFrame').src  = urlEmbebida(p.informe);
  document.getElementById('modal').classList.add('on');
}
function cerrarModal(){
  document.getElementById('modal').classList.remove('on');
  document.getElementById('modalFrame').src = 'about:blank';
}

/* ── Eventos ── */
document.getElementById('busqueda').addEventListener('input', e => { estado.q = e.target.value; pintar(); });
document.getElementById('agrupar').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  estado.modo = b.dataset.modo;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  pintar();
});
document.getElementById('btnRefrescar').onclick = cargar;
document.getElementById('modalCerrar').onclick  = cerrarModal;
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') cerrarModal(); });
document.getElementById('pinAceptar').onclick   = validarPin;
document.getElementById('pinCancelar').onclick  = cerrarPin;
document.getElementById('sesion').onclick       = cerrarSesionGerencia;
document.getElementById('pinInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') validarPin();
});
document.getElementById('pinFondo').addEventListener('click', e => { if(e.target.id === 'pinFondo') cerrarPin(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ cerrarModal(); cerrarPin(); }
  if(e.key === '/' && document.activeElement.id !== 'busqueda'){ e.preventDefault(); document.getElementById('busqueda').focus(); }
});

pintarSesion();
cargar();
setInterval(cargar, 5 * 60 * 1000);   // refresco automático cada 5 minutos
</script>
